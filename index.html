<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ALLOI — Your world. One search.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7faff;--fg:#0f2147;--muted:#5a6b8c;--card:#ffffff;--line:#dce8fb;--a:#2563eb;--b:#ffc933;--c:#8fe6b4;--d:#5b9bff;--ok:#0e8f7a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1326;--fg:#eaf1ff;--muted:#9fb0d0;--card:#13203b;--line:#233456;--ok:#3fd6bd}}
:root[data-theme="dark"]{--bg:#0b1326;--fg:#eaf1ff;--muted:#9fb0d0;--card:#13203b;--line:#233456;--ok:#3fd6bd}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:600;line-height:1.5;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.3;pointer-events:none;z-index:0}
.b1{width:340px;height:340px;background:var(--a);top:-90px;left:-80px}
.b2{width:300px;height:300px;background:var(--b);top:160px;right:-100px}
.b3{width:280px;height:280px;background:var(--c);bottom:-80px;left:20%}
main{position:relative;z-index:1;max-width:740px;margin:0 auto;padding:28px 16px 56px}
.hero{text-align:center}
.logo{width:84px;height:84px;margin:0 auto 12px;border-radius:26px;background:linear-gradient(135deg,var(--a),var(--d));color:#fff;display:grid;place-items:center;font-size:40px;font-weight:900;box-shadow:0 14px 34px rgba(37,99,235,.35)}
h1{margin:0;font-size:60px;font-weight:900;letter-spacing:2px;line-height:1.1}
h1 span{display:inline-block}
h1 span{color:var(--a)}
.tag{margin:4px 0 24px;font-size:20px;color:var(--muted)}
.ring{border-radius:28px;padding:3px;background:linear-gradient(90deg,var(--a),var(--b),var(--c),var(--d),var(--a));background-size:300% 100%}
.box{background:var(--card);border-radius:25px;padding:14px 16px;text-align:left}
.box input{width:100%;border:0;outline:0;font:inherit;font-size:19px;padding:8px 2px;background:transparent;color:var(--fg)}
.box input::placeholder{color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin-top:8px;padding-top:12px;color:var(--muted);font-size:14px}
.go{border:0;background:linear-gradient(135deg,var(--a),var(--d));color:#fff;width:54px;height:42px;border-radius:14px;font-size:22px;font-weight:900;cursor:pointer;transition:transform .2s}
.go:hover{transform:translateY(-3px) scale(1.05)}
.go:active{transform:scale(.92)}
.go:focus-visible,.chip:focus-visible,input:focus-visible,.link:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.chip{border:2px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:7px 16px;font:inherit;font-size:15px;cursor:pointer;transition:transform .2s,border-color .2s}
.chip:hover{transform:translateY(-4px) rotate(-2deg);border-color:var(--b)}
.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:26px}
.feat{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 10px;text-align:center;font-size:14px}
.ico{display:block;font-size:30px;margin-bottom:4px}
#status{margin:28px 4px 10px;color:var(--muted);font-size:15px;min-height:24px;display:flex;align-items:center;gap:10px}
.dots{display:none;gap:5px}.dots.on{display:inline-flex}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--a);display:block}
.dots i:nth-child(2){background:var(--b)}.dots i:nth-child(3){background:var(--c)}
.item{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--sc,var(--a));border-radius:18px;padding:14px 16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.item.partner{border:2px solid var(--b);border-left:6px solid var(--b);box-shadow:0 10px 28px rgba(255,201,51,.35)}
.item.ph{height:78px;background:linear-gradient(90deg,var(--card) 25%,var(--line) 50%,var(--card) 75%);background-size:300% 100%}
.name{font-weight:800;font-size:17px}
.seller{color:var(--muted);font-size:14px}
.price{font-weight:900;font-size:21px;white-space:nowrap;text-align:right}
.badge{display:inline-block;font-size:12px;font-weight:800;border-radius:8px;padding:1px 9px;margin-left:8px;vertical-align:middle;color:#fff}
.b-p{background:var(--b);color:#4a3600}.b-c{background:#c9f5da;color:#0b5a35}
.link{color:var(--a);font-size:14px;font-weight:800;text-decoration:none;display:inline-block;transition:transform .2s}
.link:hover{transform:translateX(4px)}
.box,.feat,.item{box-shadow:0 8px 24px rgba(37,99,235,.08)}
.item{transition:transform .25s,box-shadow .25s}
.item:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(37,99,235,.16)}
.feat{transition:transform .25s}.feat:hover{transform:translateY(-4px)}
.dot{position:fixed;left:0;top:0;border-radius:50%;pointer-events:none;z-index:50;display:none;transition:width .2s,height .2s,margin .2s}
@media (pointer:fine){.dot.on{display:block}}
.dot.d1{width:9px;height:9px;margin:-4.5px 0 0 -4.5px;background:var(--a)}
.dot.d2{width:7px;height:7px;margin:-3.5px 0 0 -3.5px;background:var(--c)}
.dot.d3{width:5px;height:5px;margin:-2.5px 0 0 -2.5px;background:var(--b)}
.dot.d1.big{width:20px;height:20px;margin:-10px 0 0 -10px;background:rgba(37,99,235,.25)}
.ai{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:18px;padding:14px 16px;margin-bottom:12px}
.note{margin-top:30px;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:no-preference){
 .b1{animation:drift 14s ease-in-out infinite alternate}
 .b2{animation:drift 18s ease-in-out infinite alternate-reverse}
 .b3{animation:drift 16s ease-in-out infinite alternate}
 @keyframes drift{to{transform:translate(50px,40px) scale(1.15)}}
 .logo{animation:wob 4s ease-in-out infinite}
 @keyframes wob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
 h1 span{animation:letter .7s cubic-bezier(.2,1.6,.4,1) both;animation-delay:calc(var(--i)*90ms + 200ms)}
 @keyframes letter{from{opacity:0;transform:translateY(40px) scale(.4) rotate(-12deg)}}
 .tag{animation:fade .8s .8s both}
 @keyframes fade{from{opacity:0;transform:translateY(10px)}}
 .ring{animation:slide 6s linear infinite,fade .8s 1s both}
 @keyframes slide{to{background-position:300% 0}}
 .go{animation:pulse 2.4s ease-in-out infinite}
 @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,.45)}50%{box-shadow:0 0 0 10px rgba(37,99,235,0)}}
 .chip{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both;animation-delay:calc(1.3s + var(--i)*120ms)}
 @keyframes pop{from{opacity:0;transform:scale(.3)}}
 .feat{animation:rise .6s cubic-bezier(.2,1.2,.4,1) both;animation-delay:calc(1.7s + var(--i)*150ms)}
 @keyframes rise{from{opacity:0;transform:translateY(30px)}}
 .ico{animation:bob 2.6s ease-in-out infinite;animation-delay:calc(var(--i)*.4s)}
 @keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(8deg)}}
 .dots i{animation:jump .9s ease-in-out infinite}
 .dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
 @keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-9px)}}
 .item.new{animation:slidein .6s cubic-bezier(.2,1.3,.4,1)}
 @keyframes slidein{from{opacity:0;transform:translateX(-40px) scale(.95)}}
 .item.ph{animation:shim 1.4s linear infinite}
 @keyframes shim{to{background-position:-300% 0}}
 .badge{animation:badge .5s cubic-bezier(.2,2,.4,1)}
 @keyframes badge{from{transform:scale(0) rotate(-20deg)}}
}
@media (max-width:460px){h1{font-size:50px}.feats{gap:8px}.feat{font-size:13px;padding:12px 6px}.item{flex-direction:column;align-items:flex-start}.price{text-align:left}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<main>
<section class="hero">
  <div class="logo" aria-hidden="true">A.</div>
  <h1 id="title" aria-label="ALLOI"></h1>
  <p class="tag">Your world. One search.</p>
  <div class="ring"><div class="box">
    <input id="q" type="search" placeholder="Nima qidiryapsiz?" aria-label="Qidiruv" autocomplete="off">
    <div class="row"><span>AI yordamida qidiruv</span><button class="go" id="btn" aria-label="Qidirish">↑</button></div>
  </div></div>
  <div class="chips" id="chips">
    <button class="chip" style="--i:0">telefon</button><button class="chip" style="--i:1">noutbuk</button><button class="chip" style="--i:2">oyoq kiyim</button>
  </div>
  <div class="feats">
    <div class="feat" style="--i:0"><span class="ico" style="--i:0">🛍️</span>Mahsulot toping</div>
    <div class="feat" style="--i:1"><span class="ico" style="--i:1">⚖️</span>Narxni solishtiring</div>
    <div class="feat" style="--i:2"><span class="ico" style="--i:2">✨</span>Nomini bilmasangiz ham toping</div>
  </div>
</section>

<div id="status" role="status" aria-live="polite"><span class="dots" id="dots"><i></i><i></i><i></i></span><span id="stxt"></span></div>
<div id="out"></div>
<div id="pending"></div>

<p class="note">ALLOI narxlarni so‘rov paytida internetdan qidiradi. Narx va mavjudlik do‘konda farq qilishi mumkin, xarid qilishdan oldin do‘kon sahifasida tekshiring.</p>
</main>
<script>
var $=function(id){return document.getElementById(id)};
var RM=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var WORKER_URL="https://alloi-search.ganiyev1012.workers.dev";
var PALETTE=["#2563eb","#5fd39a","#ffc933","#5b9bff","#2563eb","#5fd39a"];
var reqId=0;
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
"ALLOI".split("").forEach(function(ch,i){var s=el("span","",ch);s.style.setProperty("--i",i);$("title").appendChild(s)});
function fmtNum(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g," ")}
function priceText(r){if(r.links)return"";return typeof r.price==="number"?fmtNum(Math.round(r.price))+" "+(r.currency||"soʻm"):"Narx aniqlanmadi"}
function countUp(node,r){
  if(typeof r.price!=="number"||RM){node.textContent=priceText(r);return}
  var t0=null;
  function step(t){if(!t0)t0=t;var p=Math.min((t-t0)/800,1),e=1-Math.pow(1-p,3);node.textContent=fmtNum(Math.round(r.price*e))+" "+(r.currency||"soʻm");if(p<1)requestAnimationFrame(step);else node.textContent=priceText(r)}
  requestAnimationFrame(step);
}
function build(r,idx){
  var card=el("div","item new");card.style.setProperty("--sc",PALETTE[idx%PALETTE.length]);
  card.addEventListener("animationend",function(){card.classList.remove("new")});
  var l=el("div");l.appendChild(el("div","name",r.title||"Mahsulot"));
  l.appendChild(el("div","seller",r.seller||"Do‘kon"));
  if(r.note)l.appendChild(el("div","seller",r.note));
  var right=el("div");var pr=el("div","price","");right.appendChild(pr);
  if(/^https?:\/\//i.test(r.url||"")){var a=el("a","link","Do‘konga o‘tish →");a.href=r.url;a.target="_blank";a.rel="noopener noreferrer nofollow";right.appendChild(a)}
  card.appendChild(l);card.appendChild(right);countUp(pr,r);
  return card;
}
var STORES=[["Uzum Market","uzum.uz"],["Asaxiy","asaxiy.uz"],["Mediapark","mediapark.uz"],["Texnomart","texnomart.uz"],["OLX","olx.uz"]];
function linksMode(q,id){
  var out=$("out"),pend=$("pending");pend.textContent="";$("dots").classList.remove("on");
  STORES.forEach(function(s,i){
    var u="https://www.google.com/search?q="+encodeURIComponent(q+" site:"+s[1]);
    out.appendChild(build({title:s[0],seller:"“"+q+"” bo‘yicha natijalarni ko‘rish",url:u,links:true},i));
  });
  $("stxt").textContent=STORES.length+" ta do‘konda “"+q+"” bo‘yicha qidiruv tayyor. Narxlarni do‘kon sahifasida ko‘rasiz.";
}
async function search(){
  var q=$("q").value.trim(),st=$("stxt"),out=$("out"),pend=$("pending"),id=++reqId;
  out.textContent="";pend.textContent="";
  if(!q){$("dots").classList.remove("on");st.textContent="Nima qidirayotganingizni yozing, masalan: telefon.";return}
  if(WORKER_URL.indexOf("WORKER-MANZILI")>-1){linksMode(q,id);return}
  $("dots").classList.add("on");
  st.textContent="“"+q+"” bo‘yicha internetdan qidirilmoqda… (10-30 soniya ketishi mumkin)";
  for(var k=0;k<4;k++)pend.appendChild(el("div","item ph"));
  var data;
  try{
    var res=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({q:q})});
    if(!res.ok){var er=new Error("bad");er.s=res.status;throw er}
    data=await res.json();
  }catch(e){
    if(id!==reqId)return;
    pend.textContent="";$("dots").classList.remove("on");
    st.textContent=e.s===429?"Hozir so‘rovlar juda ko‘p. Bir daqiqadan keyin urinib ko‘ring.":"Hozir qidirib bo‘lmadi. Birozdan keyin qayta urinib ko‘ring.";return;
  }
  if(id!==reqId)return;
  pend.textContent="";$("dots").classList.remove("on");
  var rs=Array.isArray(data.results)?data.results:[];
  if(data.summary){var box=el("div","ai");box.appendChild(el("div","name","AI xulosasi"));box.appendChild(el("div","",data.summary));out.appendChild(box)}
  var nums=rs.filter(function(r){return typeof r.price==="number"});
  var same=nums.length>1&&nums.every(function(r){return r.currency===nums[0].currency});
  var min=same?Math.min.apply(null,nums.map(function(r){return r.price})):null;
  rs.forEach(function(r,i){var c=build(r,i);if(same&&r.price===min)c.querySelector(".name").appendChild(el("span","badge b-c","Eng arzon"));out.appendChild(c)});
  if(data.sg){var fr=document.createElement("iframe");fr.setAttribute("sandbox","allow-popups allow-popups-to-escape-sandbox");fr.srcdoc=data.sg;fr.style.cssText="width:100%;height:70px;border:0;margin-top:10px;border-radius:12px;color-scheme:light";out.appendChild(fr)}
  st.textContent=rs.length?rs.length+" ta natija topildi. Narxni xarid qilishdan oldin do‘konda tekshiring.":"Hech narsa topilmadi. Boshqacharoq yozib ko‘ring.";
}
$("btn").addEventListener("click",search);
$("q").addEventListener("keydown",function(e){if(e.key==="Enter")search()});
$("chips").addEventListener("click",function(e){if(e.target.classList.contains("chip")){$("q").value=e.target.textContent;search()}});
if(!RM){
  var words=["telefon","noutbuk","oyoq kiyim","suv o‘tkazmaydigan quloqchin"],wi=0,ci=0,del=false,inp=$("q");
  (function tw(){
    if(document.activeElement===inp||inp.value){inp.placeholder="Nima qidiryapsiz?";setTimeout(tw,900);return}
    var w=words[wi];
    if(!del){ci++;if(ci===w.length){del=true;inp.placeholder="Masalan: "+w+"|";return setTimeout(tw,1500)}}
    else{ci--;if(ci===0){del=false;wi=(wi+1)%words.length}}
    inp.placeholder="Masalan: "+w.slice(0,ci)+"|";
    setTimeout(tw,del?35:85);
  })();
}
if(!RM&&window.matchMedia("(pointer: fine)").matches){
  var ds=[0.35,0.18,0.09].map(function(k,i){var d=el("div","dot d"+(i+1));document.body.appendChild(d);return{d:d,k:k,x:0,y:0}});
  var tx=0,ty=0;
  document.addEventListener("mousemove",function(e){tx=e.clientX;ty=e.clientY;ds.forEach(function(o){o.d.classList.add("on")})});
  document.addEventListener("mouseover",function(e){ds[0].d.classList.toggle("big",!!(e.target.closest&&e.target.closest("a,button,input,.chip")))});
  (function loop(){ds.forEach(function(o){o.x+=(tx-o.x)*o.k;o.y+=(ty-o.y)*o.k;o.d.style.transform="translate3d("+o.x+"px,"+o.y+"px,0)"});requestAnimationFrame(loop)})();
}
</script>
</body>
</html>
